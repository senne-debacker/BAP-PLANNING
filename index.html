<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krabbels planning</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1c2133;--mute:#6b7184;--line:#e3e0d6;--blue:#2966eb;--school:#e5484d;--mile:#f59e0b;--talk:#8b5cf6;--task:#2966eb;
--ns:#9aa0ae;--iw:#2966eb;--ad:#f59e0b;--dn:#22a05b;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1d2029;--ink:#eceef3;--mute:#9298a8;--line:#2c303b;--shadow:none}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1d2029;--ink:#eceef3;--mute:#9298a8;--line:#2c303b;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:30px;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:4px}
.next{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.pill b{display:block;font-size:20px}
.pill small{color:var(--mute)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--ink);padding:6px 12px;border-radius:7px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
select,.btn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.btn{cursor:pointer}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute)}
main{max-width:1200px;margin:0 auto;padding:16px}
.week{margin-bottom:28px}
.week h2{font-size:18px;margin:0 0 4px}
.week .range{color:var(--mute);font-size:13px;margin-bottom:10px}
.week.now h2::after{content:"deze week";margin-left:8px;font-size:12px;background:var(--blue);color:#fff;padding:2px 8px;border-radius:99px;vertical-align:middle}
.list{display:grid;gap:8px}
.task{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--task);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.task[data-type="School-deadline"]{border-left-color:var(--school)}
.task[data-type="Tussendeadline"]{border-left-color:var(--mile)}
.task[data-type="Overleg"]{border-left-color:var(--talk)}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.tt{font-weight:600}
.meta{color:var(--mute);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.note{grid-column:1/-1;color:var(--mute);font-size:13px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ctl select{font-size:13px;padding:4px 6px}
.st{font-weight:600}
.st[data-s="Not started"]{color:var(--ns)} .st[data-s="In works"]{color:var(--iw)} .st[data-s="Almost done"]{color:var(--ad)} .st[data-s="Done"]{color:var(--dn)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.tag.School-deadline{color:var(--school)} .tag.Tussendeadline{color:var(--mile)} .tag.Overleg{color:var(--talk)} .tag.Taak{color:var(--task)}
.extra{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 6px}
/* kalender */
.month{margin-bottom:28px}
.month h2{font-size:18px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px;overflow:hidden}
.day.out{opacity:.35}
.day.today{outline:2px solid var(--blue)}
.dnum{font-size:12px;color:var(--mute)}
.ev{font-size:11.5px;line-height:1.25;margin-top:3px;padding:2px 4px;border-radius:4px;background:color-mix(in srgb,var(--task) 14%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ev[data-type="School-deadline"]{background:var(--school);color:#fff;font-weight:600}
.ev[data-type="Tussendeadline"]{background:color-mix(in srgb,var(--mile) 25%,transparent)}
.ev[data-type="Overleg"]{background:color-mix(in srgb,var(--talk) 18%,transparent)}
.ev.done{text-decoration:line-through;opacity:.6}
/* bord */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto}
.col h3{margin:0 0 8px;font-size:14px}
.col .list{min-height:60px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin:4px 0 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
footer{max-width:1200px;margin:0 auto;padding:8px 16px 40px;color:var(--mute);font-size:13px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
@media (max-width:700px){
  .grid .dow{font-size:10px}.day{min-height:64px}.ev{font-size:10px}
  .task{grid-template-columns:1fr}.ctl{justify-content:flex-start}
}
</style>
</head>

<main id="main"></main>
<footer>

</footer>

sturen", "type": "Taak", "ond": "Bouw", "start": "2026-11-26", "end": "2026-12-08", "prio": "Extra", "dep": "Materiaal uitlenen op school", "note": "", "status": "Not started"}, {"id": "overleg-laura-8-12", "t": "Overleg Laura 8/12", "type": "Overleg", "ond": "Communicatie", "start": "2026-12-08", "end": "2026-12-08", "prio": "Basis", "dep": "", "note": "", "status": "Not started"}, {"id": "fixes-uit-de-test", "t": "Fixes uit de test", "type": "Taak", "ond": "Development", "start": "2026-12-07", "end": "2026-12-11", "prio": "Basis", "dep": "Testresultaten verwerken en prioriteiten kiezen", "note": "", "status": "Not started"}, {"id": "game-finale-ontsnapping-en-uitgangsscherm", "t": "Game: finale, ontsnapping en uitgangsscherm", "type": "Taak", "ond": "Development", "start": "2026-12-07", "end": "2026-12-11", "prio": "Basis", "dep": "Testresultaten verwerken en prioriteiten kiezen", "note": "", "status": "Not started"}, {"id": "geluid-en-muziek", "t": "Geluid en muziek", "type": "Taak", "ond": "Design", "start": "2026-12-07", "end": "2026-12-11", "prio": "Extra", "dep": "", "note": "", "status": "Not started"}, {"id": "mvp-klaar-feature-freeze", "t": "MVP klaar (feature freeze)", "type": "Tussendeadline", "ond": "Development", "start": "2026-12-11", "end": "2026-12-11", "prio": "Basis", "dep": "Fixes uit de test", "note": "Daarna enkel nog bugs. 5 dagen speling", "status": "Not started"}, {"id": "jury-verhaal-en-presentatie", "t": "Jury: verhaal en presentatie", "type": "Taak", "ond": "Communicatie", "start": "2026-12-08", "end": "2026-12-13", "prio": "Basis", "dep": "", "note": "12 min + 3 min vragen. Resultaat moet schitteren. Titel + slide met contactgegevens", "status": "Not started"}, {"id": "jury-video-van-hoe-het-werkt", "t": "Jury: video van hoe het werkt", "type": "Taak", "ond": "Communicatie", "start": "2026-12-10", "end": "2026-12-13", "prio": "Basis", "dep": "Game: finale, ontsnapping en uitgangsscherm", "note": "Als back-up voor de live demo", "status": "Not started"}, {"id": "opstelling-voor-de-jury-bouwen", "t": "Opstelling voor de jury bouwen", "type": "Taak", "ond": "Bouw", "start": "2026-12-07", "end": "2026-12-14", "prio": "Basis", "dep": "Testresultaten verwerken en prioriteiten kiezen", "note": "Testversie van de booth of de campusopstelling verbeteren. Beslissen in week 4", "status": "Not started"}, {"id": "readme-hoe-start-je-de-installatie-op", "t": "Readme: hoe start je de installatie op", "type": "Taak", "ond": "Development", "start": "2026-12-10", "end": "2026-12-14", "prio": "Basis", "dep": "", "note": "Verplicht bij de jury", "status": "Not started"}, {"id": "generale-repetitie-jury", "t": "Generale repetitie jury", "type": "Taak", "ond": "Communicatie", "start": "2026-12-14", "end": "2026-12-14", "prio": "Basis", "dep": "Jury: verhaal en presentatie", "note": "Met opstelling en timer", "status": "Not started"}, {"id": "overleg-laura-15-12", "t": "Overleg Laura 15/12", "type": "Overleg", "ond": "Communicatie", "start": "2026-12-15", "end": "2026-12-15", "prio": "Basis", "dep": "", "note": "", "status": "Not started"}, {"id": "zips-readme-pdf-en-bronbestand-klaar", "t": "Zips, readme, pdf en bronbestand klaar", "type": "Tussendeadline", "ond": "Communicatie", "start": "2026-12-15", "end": "2026-12-15", "prio": "Basis", "dep": "Readme: hoe start je de installatie op", "note": "1 dag speling", "status": "Not started"}, {"id": "jury-indienen", "t": "Jury indienen", "type": "School-deadline", "ond": "Communicatie", "start": "2026-12-16", "end": "2026-12-16", "prio": "Basis", "dep": "Zips, readme, pdf en bronbestand klaar", "note": "Readme + XD/DESIGN/DEVELOPMENT-zips + PRESENTATION.pdf en bron, voor 22u", "status": "Not started"}, {"id": "opstelling-neerzetten-op-campus", "t": "Opstelling neerzetten op campus", "type": "Taak", "ond": "Bouw", "start": "2026-12-16", "end": "2026-12-16", "prio": "Basis", "dep": "Opstelling voor de jury bouwen", "note": "Atelier 2, Atelier 3, achteraan Atelier 1 of Passerelle 1, vanaf 16/12", "status": "Not started"}, {"id": "jury", "t": "Jury", "type": "School-deadline", "ond": "Communicatie", "start": "2026-12-17", "end": "2026-12-17", "prio": "Basis", "dep": "Jury indienen", "note": "Datum en slot nog niet bekend. 20 min op voorhand aanwezig", "status": "Not started"}, {"id": "alle-bronbestanden-naar-jef-sturen", "t": "Alle bronbestanden naar JEF sturen", "type": "School-deadline", "ond": "Communicatie", "start": "2026-12-18", "end": "2026-12-18", "prio": "Basis", "dep": "Jury indienen", "note": "Voor 22u. Met Laura afspreken hoe (WeTransfer?)", "status": "Not started"}];
const STAT = ["Not started","In works","Almost done","Done"];
const WHO = ["","Ibe","Senne","Tjorven"];
const KEY = "krabbels-planning-v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e) {} }
function st(t){ return (saved[t.id] && saved[t.id].s) || t.status; }
function wie(t){ return (saved[t.id] && saved[t.id].w) || ""; }
function set(t,k,v){ saved[t.id] = Object.assign({}, saved[t.id], {[k]:v}); save(); render(); }

const D = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const TODAY = (()=>{ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const MON = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MONL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const fmt = d => d.getDate()+" "+MON[d.getMonth()];
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function monday(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
function weekNr(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }

const onds = [...new Set(TASKS.map(t=>t.ond))].sort();
document.getElementById("fOnd").insertAdjacentHTML("beforeend", onds.map(o=>`<option>${esc(o)}</option>`).join(""));
let view = "weken";
try { view = localStorage.getItem(KEY+"-view") || "weken"; } catch(e) {}

function filtered(){
  const w=fWie.value, o=fOnd.value, ty=fType.value, done=fDone.checked||view==="bord";
  return TASKS.filter(t => (!o||t.ond===o) && (!ty||t.type===ty) && (done || st(t)!=="Done")
    && (!w || (w==="-" ? !wie(t) : wie(t)===w)));
}

function card(t){
  const s=st(t), e=D(t.end), b=D(t.start);
  const when = t.start===t.end ? fmt(e) : fmt(b)+" → "+fmt(e);
  const late = s!=="Done" && e<TODAY;
  return `<div class="task ${s==="Done"?"done":""}" data-type="${esc(t.type)}">
    <div><span class="tag ${esc(t.type)}">${esc(t.type)}</span> ${t.prio==="Extra"?'<span class="extra">extra</span>':""}
      <div class="tt">${esc(t.t)}</div>
      <div class="meta"><span>${when}${late?' · <b style="color:var(--school)">te laat</b>':""}</span><span>${esc(t.ond)}</span>${t.dep?`<span>na: ${esc(t.dep)}</span>`:""}</div>
    </div>
    <div class="ctl">
      <select data-id="${t.id}" data-k="w" aria-label="Wie">${WHO.map(x=>`<option value="${x}" ${wie(t)===x?"selected":""}>${x||"Wie?"}</option>`).join("")}</select>
      <select data-id="${t.id}" data-k="s" class="st" data-s="${s}" aria-label="Status">${STAT.map(x=>`<option ${s===x?"selected":""}>${x}</option>`).join("")}</select>
    </div>
    ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
  </div>`;
}

const legend = `<div class="legend"><span><i style="background:var(--school)"></i>School-deadline</span><span><i style="background:var(--mile)"></i>Eigen tussendeadline</span><span><i style="background:var(--task)"></i>Taak</span><span><i style="background:var(--talk)"></i>Overleg</span></div>`;

function renderWeken(list){
  const by = new Map();
  for (const t of list){ const m=iso(monday(D(t.end))); if(!by.has(m)) by.set(m,[]); by.get(m).push(t); }
  const thisMon = iso(monday(TODAY));
  return legend + [...by.keys()].sort().map(k=>{
    const m=D(k), s=new Date(m); s.setDate(s.getDate()+6);
    return `<section class="week ${k===thisMon?"now":""}"><h2>Week ${weekNr(m)}</h2><div class="range">${fmt(m)} tot ${fmt(s)}</div><div class="list">${by.get(k).map(card).join("")}</div></section>`;
  }).join("") || "<p>Niets gevonden.</p>";
}

function renderKalender(list){
  const nowYm = iso(TODAY).slice(0,7);
  const months = [...new Set(TASKS.map(t=>t.end.slice(0,7)))].sort().filter(ym=>ym>=nowYm);
  return legend + months.map(ym=>{
    const [y,m]=ym.split("-").map(Number), first=new Date(y,m-1,1), start=monday(first);
    let cells="";
    for(let i=0;i<42;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      if(i>=35 && d.getMonth()!==m-1) break;
      const ds=iso(d), evs=list.filter(t=>t.end===ds);
      cells+=`<div class="day ${d.getMonth()!==m-1?"out":""} ${+d===+TODAY?"today":""}"><div class="dnum">${d.getDate()}</div>${evs.map(t=>`<div class="ev ${st(t)==="Done"?"done":""}" data-type="${esc(t.type)}" data-open="${t.id}" title="${esc(t.t)}">${esc(t.t)}</div>`).join("")}</div>`;
    }
    return `<section class="month"><h2>${MONL[m-1]} ${y}</h2><div class="grid">${["ma","di","wo","do","vr","za","zo"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div></section>`;
  }).join("");
}

function renderBord(list){
  return `<div class="board">${STAT.map(s=>{
    const items=list.filter(t=>st(t)===s);
    return `<div class="col"><h3><span class="st" data-s="${s}">${s}</span> · ${items.length}</h3><div class="list">${items.map(card).join("")}</div></div>`;
  }).join("")}</div>`;
}

function renderNext(){
  const up = TASKS.filter(t=>t.type==="School-deadline" && D(t.end)>=TODAY).slice(0,3);
  const done = TASKS.filter(t=>st(t)==="Done").length;
  next.innerHTML = up.map(t=>{ const n=Math.round((D(t.end)-TODAY)/864e5);
    return `<div class="pill"><small>${esc(t.t)}</small><b>${n===0?"vandaag":n===1?"morgen":"nog "+n+" dagen"}</b><small>${fmt(D(t.end))}</small></div>`; }).join("")
    + `<div class="pill"><small>Klaar</small><b>${done} / ${TASKS.length}</b><small>taken</small></div>`;
}

function render(){
  fDone.parentElement.style.display = view==="bord" ? "none" : "";
  const list = filtered();
  main.innerHTML = view==="kalender" ? renderKalender(list) : view==="bord" ? renderBord(list) : renderWeken(list);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  renderNext();
}

main.addEventListener("change", e=>{
  const el=e.target.closest("select[data-id]"); if(!el) return;
  set(TASKS.find(t=>t.id===el.dataset.id), el.dataset.k, el.value);
});
main.addEventListener("click", e=>{
  const ev=e.target.closest("[data-open]"); if(!ev) return;
  const t=TASKS.find(x=>x.id===ev.dataset.open);
  dlg.innerHTML = `<form method="dialog" style="margin:0">${card(t)}<div style="text-align:right;margin-top:10px"><button class="btn">Sluiten</button></div></form>`;
  dlg.showModal();
});
dlg.addEventListener("change", e=>{
  const el=e.target.closest("select[data-id]"); if(!el) return;
  set(TASKS.find(t=>t.id===el.dataset.id), el.dataset.k, el.value); dlg.close();
});
document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return; view=b.dataset.v;
  try { localStorage.setItem(KEY+"-view", view); } catch(err) {}
  render();
});
[fWie,fOnd,fType,fDone].forEach(el=>el.addEventListener("change", render));
reset.addEventListener("click", ()=>{ if(confirm("Alle statussen en namen in deze browser wissen?")){ saved={}; save(); render(); } });
render();
</script>
</body>
</html>
